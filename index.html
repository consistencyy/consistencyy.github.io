<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conor McCutcheon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --text: #f0ede8;
      --muted: #555550;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --c1: #c8f04a;
      --c2: #f07aaa;
      --c3: #6ab4f5;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
    }

    /* PAGE SYSTEM */
    .page {
      display: none;
      min-height: 100svh;
      flex-direction: column;
    }
    .page.active { display: flex; }

    /* NAV */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.75rem 5vw;
      flex-shrink: 0;
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      position: relative;
      overflow: hidden;
      display: inline-block;
      vertical-align: bottom;
    }

    .nav-logo .logo-default,
    .nav-logo .logo-home {
      display: block;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }

    .nav-logo .logo-home {
      position: absolute;
      top: 0; left: 0;
      white-space: nowrap;
      transform: translateY(100%);
      opacity: 0;
      font-style: italic;
      color: var(--muted);
    }

    .nav-logo:hover .logo-default {
      transform: translateY(-100%);
      opacity: 0;
    }

    .nav-logo:hover .logo-home {
      transform: translateY(0);
      opacity: 1;
    }

    .nav-contact {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
      font-family: var(--sans);
    }
    .nav-contact:hover { color: var(--text); }

    /* MAIN */
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 5vw 4rem;
      flex: 1;
    }

    .headline {
      font-family: var(--serif);
      font-size: clamp(2.25rem, 6vw, 4.5rem);
      font-weight: 400;
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 3.5rem;
      max-width: 18ch;
    }

    .headline em {
      font-style: italic;
      color: var(--muted);
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      text-decoration: none;
      color: #0a0a0a;
      padding: 2.25rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      text-align: left;
      font-family: var(--sans);
      transition: filter 0.2s, transform 0.2s;
    }

    .card:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .card:hover .card-arrow { transform: translateX(4px); }

    .card-1 { --card-bg: var(--c1); }
    .card-2 { --card-bg: var(--c2); }
    .card-3 { --card-bg: var(--c3); }

    .card-num {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.875rem;
      color: rgba(0,0,0,0.4);
    }

    .card-title {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 2.25vw, 1.75rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.015em;
      color: #0a0a0a;
    }

    .card-desc {
      font-size: 0.85rem;
      color: rgba(0,0,0,0.55);
      font-weight: 400;
      line-height: 1.65;
      flex: 1;
    }

    .card-arrow {
      font-size: 1rem;
      color: rgba(0,0,0,0.4);
      transition: transform 0.25s ease;
      margin-top: auto;
    }

    /* FOOTER */
    footer {
      padding: 1.5rem 5vw;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* CONTACT PAGE */
    .contact-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 5vw 4rem;
    }

    .contact-headline {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.06;
      color: var(--text);
      margin-bottom: 3rem;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 560px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-top: 1px solid #1a1a18;
      text-decoration: none;
      color: var(--text);
      transition: color 0.2s;
      gap: 1rem;
    }

    .contact-row:last-child { border-bottom: 1px solid #1a1a18; }

    .contact-row:hover { color: var(--row-color); }
    .contact-row:hover .contact-arrow { transform: translateX(4px); }

    .contact-row-1 { --row-color: var(--c1); }
    .contact-row-2 { --row-color: var(--c2); }
    .contact-row-3 { --row-color: var(--c3); }

    .contact-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 72px;
    }

    .contact-value {
      font-family: var(--serif);
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      flex: 1;
    }

    .contact-arrow {
      color: var(--muted);
      font-size: 1rem;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    /* LOADER */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #loader.hidden { opacity: 0; }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .loader-name {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
      opacity: 0;
      animation: fadeWord 0.6s ease 0.2s forwards;
    }

    .loader-bar-wrap {
      width: 180px;
      height: 1px;
      background: #1e1e1c;
      position: relative;
      overflow: hidden;
    }

    .loader-bar {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
      transform: scaleX(0);
      transform-origin: left;
      animation: fillBar 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
    }

    @keyframes fadeWord {
      to { opacity: 1; }
    }

    @keyframes fillBar {
      to { transform: scaleX(1); }
    }

    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; gap: 0.75rem; }
      .headline { margin-bottom: 2.5rem; }
      .contact-value { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="loader-inner">
      <span class="loader-name">Conor McCutcheon</span>
      <div class="loader-bar-wrap">
        <div class="loader-bar"></div>
      </div>
    </div>
  </div>

  <!-- HOME PAGE -->
  <div class="page active" id="page-home">
    <nav>
      <button class="nav-logo" onclick="show('home')">
        <span class="logo-default">Conor McCutcheon</span>
        <span class="logo-home">&#8592; Home</span>
      </button>
      <button class="nav-contact" onclick="show('contact')">Contact</button>
    </nav>

    <main>
      <h1 class="headline">What brings you <em>here today?</em></h1>

      <div class="cards">
        <button class="card card-1" onclick="location.href='https://consistency.ink/windows-xp'">
          <span class="card-num">i.</span>
          <h2 class="card-title">Portfolio</h2>
          <p class="card-desc">Browse my work — design, development, and creative projects.</p>
          <span class="card-arrow">&#8594;</span>
        </button>

        <button class="card card-2" onclick="location.href='/design'">
          <span class="card-num">ii.</span>
          <h2 class="card-title">Graphic Design Services</h2>
          <p class="card-desc">Hire me for a project — services, pricing, and contact all in one place.</p>
          <span class="card-arrow">&#8594;</span>
        </button>

        <button class="card card-3" onclick="location.href='https://consistency.ink/windows-xp/notary'">
          <span class="card-num">iii.</span>
          <h2 class="card-title">Mobile Notary</h2>
          <p class="card-desc">Licensed mobile notary for loan signings and legal documents — I come to you.</p>
          <span class="card-arrow">&#8594;</span>
        </button>
      </div>
    </main>

    <footer>
      <span>&copy; 2026 Conor McCutcheon</span>
      <button class="nav-contact" onclick="show('contact')" style="font-size:0.75rem;">conormcc.edits@gmail.com</button>
    </footer>
  </div>

  <!-- CONTACT PAGE -->
  <div class="page" id="page-contact">
    <nav>
      <button class="nav-logo" onclick="show('home')">
        <span class="logo-default">Conor McCutcheon</span>
        <span class="logo-home">&#8592; Home</span>
      </button>
      <button class="nav-contact" onclick="show('home')">&#8592; Back</button>
    </nav>

    <div class="contact-main">
      <h1 class="contact-headline">Get in touch.</h1>

      <div class="contact-links">
        <a href="tel:+19144322249" class="contact-row contact-row-1">
          <span class="contact-label">Phone</span>
          <span class="contact-value">(914) 432-2249</span>
          <span class="contact-arrow">&#8594;</span>
        </a>
        <a href="mailto:conormcc.edits@gmail.com" class="contact-row contact-row-2">
          <span class="contact-label">Email</span>
          <span class="contact-value">conormcc.edits@gmail.com</span>
          <span class="contact-arrow">&#8594;</span>
        </a>
        <a href="https://youtube.com/@Consistencyy" target="_blank" class="contact-row contact-row-3">
          <span class="contact-label">YouTube</span>
          <span class="contact-value">@Consistencyy</span>
          <span class="contact-arrow">&#8594;</span>
        </a>
      </div>
    </div>

    <footer>
      <span>&copy; 2026 Conor McCutcheon</span>
    </footer>
  </div>

  <script>
    function show(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      window.scrollTo(0, 0);
    }

    // Dismiss loader after bar finishes (0.4s delay + 1.2s fill + 0.1s buffer)
    setTimeout(() => {
      const loader = document.getElementById('loader');
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 600);
    }, 1800);
  </script>
</body>
</html>
